target:
  repo_url: https://github.com/madeehrehman/sdlc_agent_tictactoe
  specs_path: specs.md

github:
  lifecycle_client: mcp
  project_name_from_repo: true
  develop_branch: develop
  release_branch: release
  main_branch: main
  mcp:
    docker_image: ghcr.io/github/github-mcp-server
    toolsets:
      - repos
      - issues
      - projects
    owner_type: user
    status_field_name: Status
    timeout_seconds: 30

model:
  provider: openai
  default: gpt-4o-mini
  roles:
    orchestrator: gpt-4.1
    backlog_analyzer: gpt-4.1
    developer: gpt-4.1
    pr_reviewer: gpt-4.1
